<svg width="1100" height="230" viewBox="0 0 1100 230" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated 360 Learning and SM-2 Spaced Repetition Loop">
  <defs>
    <linearGradient id="loopBg" x1="0" y1="0" x2="1100" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07080C" />
      <stop offset="100%" stop-color="#0F1320" />
    </linearGradient>
    <linearGradient id="loopStroke" x1="0" y1="0" x2="1100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <rect width="1100" height="230" rx="16" fill="url(#loopBg)" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5" />
  <text x="32" y="34" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="16" font-weight="700">Continuous 360° Mastery &amp; SM-2 Retention Loop</text>

  <!-- Loop Path -->
  <path id="loopRail" d="M 115 115 L 315 115 L 515 115 L 715 115 L 915 115 C 985 115, 985 188, 915 188 L 115 188 C 50 188, 50 115, 115 115" stroke="url(#loopStroke)" stroke-opacity="0.38" stroke-width="2" stroke-dasharray="6 5" fill="none" />

  <!-- Orbiting Mastery Signal -->
  <circle r="5" fill="#2DD4BF">
    <animateMotion dur="7s" repeatCount="indefinite"><mpath href="#loopRail" /></animateMotion>
  </circle>
  <circle r="4" fill="#A78BFA">
    <animateMotion dur="7s" begin="3.5s" repeatCount="indefinite"><mpath href="#loopRail" /></animateMotion>
  </circle>

  <!-- Step Cards -->
  <g transform="translate(45, 68)">
    <rect width="175" height="86" rx="12" fill="#10121A" stroke="#2DD4BF" stroke-opacity="0.45" />
    <text x="14" y="26" fill="#2DD4BF" font-family="ui-monospace, monospace" font-size="11" font-weight="700">01 · LEARN</text>
    <text x="14" y="48" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="700">Knowledge Hub</text>
    <text x="14" y="68" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11.5">Depth Toggles &amp; SVG</text>
  </g>

  <g transform="translate(248, 68)">
    <rect width="175" height="86" rx="12" fill="#10121A" stroke="#818CF8" stroke-opacity="0.45" />
    <text x="14" y="26" fill="#818CF8" font-family="ui-monospace, monospace" font-size="11" font-weight="700">02 · EXECUTE</text>
    <text x="14" y="48" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="700">SQL &amp; Python Arena</text>
    <text x="14" y="68" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11.5">Wasm Diff + EXPLAIN</text>
  </g>

  <g transform="translate(451, 68)">
    <rect width="175" height="86" rx="12" fill="#10121A" stroke="#A78BFA" stroke-opacity="0.45" />
    <text x="14" y="26" fill="#A78BFA" font-family="ui-monospace, monospace" font-size="11" font-weight="700">03 · COACH</text>
    <text x="14" y="48" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="700">Gemini AI Copilot</text>
    <text x="14" y="68" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11.5">Socratic Hints + Notes</text>
  </g>

  <g transform="translate(654, 68)">
    <rect width="175" height="86" rx="12" fill="#10121A" stroke="#FBBF24" stroke-opacity="0.45" />
    <text x="14" y="26" fill="#FBBF24" font-family="ui-monospace, monospace" font-size="11" font-weight="700">04 · RETAIN</text>
    <text x="14" y="48" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="700">SM-2 Queue</text>
    <text x="14" y="68" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11.5">Spaced Recall Intervals</text>
  </g>

  <g transform="translate(857, 68)">
    <rect width="195" height="86" rx="12" fill="#10121A" stroke="#34D399" stroke-opacity="0.45" />
    <text x="14" y="26" fill="#34D399" font-family="ui-monospace, monospace" font-size="11" font-weight="700">05 · CRACK</text>
    <text x="14" y="48" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="700">Voice Mock &amp; Design</text>
    <text x="14" y="68" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11.5">24 Tier-1 Company Loops</text>
  </g>
</svg>
