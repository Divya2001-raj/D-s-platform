<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="D's platforms DATA ENGINEER 360 Animated Hero Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07080C" />
      <stop offset="50%" stop-color="#0C0F1A" />
      <stop offset="100%" stop-color="#07080C" />
    </linearGradient>
    <radialGradient id="auroraTeal" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(320 40) rotate(25) scale(480 220)">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="auroraIndigo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(880 50) rotate(-18) scale(520 240)">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="pulseLine" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0" />
      <stop offset="50%" stop-color="#2DD4BF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Obsidian Canvas & Grid -->
  <rect width="1200" height="320" rx="20" fill="url(#bgGrad)" />
  <rect width="1200" height="320" rx="20" fill="url(#gridPattern)" />

  <!-- Animated Aurora Glows -->
  <rect width="1200" height="320" rx="20" fill="url(#auroraTeal)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="7s" repeatCount="indefinite" />
  </rect>
  <rect width="1200" height="320" rx="20" fill="url(#auroraIndigo)">
    <animate attributeName="opacity" values="1;0.7;1" dur="8s" repeatCount="indefinite" />
  </rect>

  <!-- Outer Hairline Border -->
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="19.5" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5" />

  <!-- Animated Background Pipeline Rails -->
  <path id="railTop" d="M 40 250 C 260 210, 420 285, 620 245 C 820 205, 980 275, 1160 235" stroke="#2DD4BF" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="6 6" fill="none" />
  <path id="railBottom" d="M 40 272 C 300 300, 500 225, 740 265 C 940 295, 1060 245, 1160 262" stroke="#818CF8" stroke-opacity="0.22" stroke-width="1.5" fill="none" />

  <!-- Moving Data Packets -->
  <circle r="4.5" fill="#2DD4BF">
    <animateMotion dur="5.5s" repeatCount="indefinite">
      <mpath href="#railTop" />
    </animateMotion>
  </circle>
  <circle r="3.5" fill="#34D399">
    <animateMotion dur="5.5s" begin="2.7s" repeatCount="indefinite">
      <mpath href="#railTop" />
    </animateMotion>
  </circle>
  <circle r="4" fill="#818CF8">
    <animateMotion dur="6.5s" repeatCount="indefinite">
      <mpath href="#railBottom" />
    </animateMotion>
  </circle>

  <!-- Brand Monogram D' -->
  <g transform="translate(518, 36)">
    <rect x="1.5" y="1.5" width="53" height="53" rx="14" fill="#10121A" fill-opacity="0.9" stroke="url(#brandGrad)" stroke-width="1.8" />
    <path d="M16 14.5H27C34.2 14.5 39.5 19.8 39.5 28C39.5 36.2 34.2 41.5 27 41.5H16V14.5Z" stroke="url(#brandGrad)" stroke-width="3" stroke-linejoin="round" />
    <path d="M22 20.5V35.5H26.8C30.8 35.5 33.2 32.8 33.2 28C33.2 23.2 30.8 20.5 26.8 20.5H22Z" fill="url(#brandGrad)" fill-opacity="0.88" />
    <path d="M43.5 13L40.5 21" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0.45;1" dur="2.6s" repeatCount="indefinite" />
    </path>
    <text x="72" y="28" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" letter-spacing="2.2">D'S PLATFORMS</text>
    <text x="72" y="50" fill="url(#brandGrad)" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="800" letter-spacing="1.4">DATA ENGINEER 360</text>
  </g>

  <!-- Main Headline -->
  <text x="600" y="148" text-anchor="middle" fill="#FFFFFF" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.8">
    Master Every Skill. Understand Every Concept.
  </text>
  <text x="600" y="186" text-anchor="middle" fill="url(#brandGrad)" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.2">
    Crack Every Tier-1 Data Engineering Round.
  </text>

  <!-- Animated Specular Divider -->
  <rect x="240" y="206" width="720" height="2" rx="1" fill="url(#pulseLine)">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="3.5s" repeatCount="indefinite" />
  </rect>

  <!-- Key Capability Callouts -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="middle">
    <rect x="115" y="226" width="215" height="34" rx="8" fill="#10121A" fill-opacity="0.88" stroke="#2DD4BF" stroke-opacity="0.35" />
    <text x="222.5" y="247" fill="#E2E8F0">126 Runnable Seed Labs</text>

    <rect x="355" y="226" width="230" height="34" rx="8" fill="#10121A" fill-opacity="0.88" stroke="#818CF8" stroke-opacity="0.35" />
    <text x="470" y="247" fill="#E2E8F0">sql.js + Pyodide Wasm</text>

    <rect x="610" y="226" width="230" height="34" rx="8" fill="#10121A" fill-opacity="0.88" stroke="#A78BFA" stroke-opacity="0.35" />
    <text x="725" y="247" fill="#E2E8F0">Gemini AI Copilot (SSE)</text>

    <rect x="865" y="226" width="220" height="34" rx="8" fill="#10121A" fill-opacity="0.88" stroke="#34D399" stroke-opacity="0.35" />
    <text x="975" y="247" fill="#E2E8F0">24 Tier-1 Company Hubs</text>
  </g>
</svg>
