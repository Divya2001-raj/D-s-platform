<svg width="1100" height="420" viewBox="0 0 1100 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated System Architecture Flow Diagram">
  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="1100" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07080C" />
      <stop offset="100%" stop-color="#0D101B" />
    </linearGradient>
    <linearGradient id="tealGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1100" height="420" rx="18" fill="url(#archBg)" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5" />

  <!-- Title -->
  <text x="40" y="42" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="18" font-weight="700">Live Full-Stack Execution &amp; AI Coaching Pipeline</text>
  <text x="40" y="64" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="12">Browser Wasm Sandboxes  ↔  Express SSE Proxy  ↔  Gemini 4 Hydrogen  ↔  Firebase Auth &amp; Firestore</text>

  <!-- Connection Paths -->
  <path id="pathUiToSql" d="M 270 155 C 325 155, 325 130, 385 130" stroke="#2DD4BF" stroke-opacity="0.45" stroke-width="2" fill="none" />
  <path id="pathUiToPy" d="M 270 215 C 325 215, 325 240, 385 240" stroke="#34D399" stroke-opacity="0.45" stroke-width="2" fill="none" />
  <path id="pathUiToApi" d="M 270 285 C 350 285, 330 340, 415 340" stroke="#A78BFA" stroke-opacity="0.5" stroke-width="2" fill="none" />
  <path id="pathApiToGemini" d="M 675 340 C 735 340, 745 340, 800 340" stroke="#A78BFA" stroke-opacity="0.6" stroke-width="2" fill="none" />
  <path id="pathUiToFb" d="M 655 185 C 735 185, 745 170, 800 170" stroke="#FBBF24" stroke-opacity="0.5" stroke-width="2" fill="none" />

  <!-- Animated Packets -->
  <circle r="4.5" fill="#2DD4BF" filter="url(#softGlow)">
    <animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#pathUiToSql" /></animateMotion>
  </circle>
  <circle r="4.5" fill="#34D399" filter="url(#softGlow)">
    <animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#pathUiToPy" /></animateMotion>
  </circle>
  <circle r="4.5" fill="#A78BFA" filter="url(#softGlow)">
    <animateMotion dur="2.1s" repeatCount="indefinite"><mpath href="#pathUiToApi" /></animateMotion>
  </circle>
  <circle r="4.5" fill="#818CF8" filter="url(#softGlow)">
    <animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#pathApiToGemini" /></animateMotion>
  </circle>
  <circle r="4.5" fill="#FBBF24" filter="url(#softGlow)">
    <animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#pathUiToFb" /></animateMotion>
  </circle>

  <!-- Node 1: React SPA Client -->
  <g transform="translate(40, 105)">
    <rect width="230" height="225" rx="14" fill="#10121A" stroke="#2DD4BF" stroke-opacity="0.45" stroke-width="1.5" />
    <text x="18" y="32" fill="#2DD4BF" font-family="ui-monospace, monospace" font-size="11" font-weight="700">FRONTEND WORKBENCH</text>
    <text x="18" y="56" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="16" font-weight="700">React 19 + Monaco</text>
    <text x="18" y="84" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">• Midnight Aurora Glass UI</text>
    <text x="18" y="106" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">• Cmd+K Command Palette</text>
    <text x="18" y="128" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">• Cmd+J AI Copilot Drawer</text>
    <text x="18" y="150" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">• Recharts Readiness Radar</text>
    <text x="18" y="172" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">• Interactive System Canvas</text>
    <text x="18" y="194" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">• Web Speech Voice Mock</text>
  </g>

  <!-- Node 2: SQLite Wasm -->
  <g transform="translate(385, 92)">
    <rect width="270" height="84" rx="12" fill="#10121A" stroke="#2DD4BF" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="24" cy="26" r="5" fill="#2DD4BF">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="38" y="30" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="700">sql.js SQLite Wasm</text>
    <text x="18" y="52" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11.5">Hermetic /sql-wasm.wasm + Diff</text>
    <text x="18" y="70" fill="#2DD4BF" font-family="ui-monospace, monospace" font-size="11.5">EXPLAIN QUERY PLAN Tree</text>
  </g>

  <!-- Node 3: Pyodide Web Worker -->
  <g transform="translate(385, 198)">
    <rect width="270" height="84" rx="12" fill="#10121A" stroke="#34D399" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="24" cy="26" r="5" fill="#34D399">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="38" y="30" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="700">Pyodide CPython Worker</text>
    <text x="18" y="52" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11.5">Isolated Thread + 25s Timeout</text>
    <text x="18" y="70" fill="#34D399" font-family="ui-monospace, monospace" font-size="11.5">SparkSession / DataFrame / F Shim</text>
  </g>

  <!-- Node 4: Express Backend -->
  <g transform="translate(415, 300)">
    <rect width="260" height="84" rx="12" fill="#10121A" stroke="#A78BFA" stroke-opacity="0.45" stroke-width="1.5" />
    <text x="18" y="28" fill="#A78BFA" font-family="ui-monospace, monospace" font-size="11" font-weight="700">EXPRESS SERVER PROXY</text>
    <text x="18" y="50" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="700">server.ts (/api/ai/*)</text>
    <text x="18" y="70" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11.5">SSE Copilot · Batch · JD · Mock</text>
  </g>

  <!-- Node 5: Firebase -->
  <g transform="translate(800, 105)">
    <rect width="260" height="150" rx="14" fill="#10121A" stroke="#FBBF24" stroke-opacity="0.45" stroke-width="1.5" />
    <text x="18" y="30" fill="#FBBF24" font-family="ui-monospace, monospace" font-size="11" font-weight="700">AUTH &amp; PERSISTENCE</text>
    <text x="18" y="54" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="15" font-weight="700">Firebase Auth &amp; Firestore</text>
    <text x="18" y="80" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">• Google + Email Sign-In</text>
    <text x="18" y="101" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">• SM-2 Queue, Notes &amp; Chat</text>
    <text x="18" y="122" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">• Admin CMS &amp; Moderation</text>
    <text x="18" y="141" fill="#FBBF24" font-family="ui-monospace, monospace" font-size="11">Strict Field-Validated Rules</text>
  </g>

  <!-- Node 6: Gemini -->
  <g transform="translate(800, 292)">
    <rect width="260" height="92" rx="14" fill="#10121A" stroke="#818CF8" stroke-opacity="0.55" stroke-width="1.5" />
    <text x="18" y="28" fill="#818CF8" font-family="ui-monospace, monospace" font-size="11" font-weight="700">SERVER-SIDE REASONING</text>
    <text x="18" y="52" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="15" font-weight="700">Google @google/genai</text>
    <text x="18" y="74" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="11.5">gemini-4-hydrogen · Thinking</text>
  </g>
</svg>
